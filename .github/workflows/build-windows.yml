name: Build Windows exe

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Self-test (source)
        run: python SpermPipeline.py --selftest
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --windowed --name SpermPipeline --collect-all hdbscan --collect-submodules sklearn --hidden-import sklearn.utils._typedefs SpermPipeline.py
      - name: Self-test (exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SpermPipeline\SpermPipeline.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content dist\SpermPipeline\selftest_log.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item dist\SpermPipeline\selftest_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SpermPipeline-windows
          path: dist/SpermPipeline

  fiji-step0:
    # шаг 0 (TrackMate в Fiji без окна) на синтетическом видео, весь путь до кластеризации
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Download Fiji
        shell: pwsh
        run: |
          $urls = @(
            'https://downloads.imagej.net/fiji/archive/20240614-2117/fiji-win64.zip',
            'https://downloads.imagej.net/fiji/latest/fiji-win64.zip',
            'https://downloads.imagej.net/fiji/stable/fiji-stable-win64-jdk.zip',
            'https://downloads.imagej.net/fiji/latest/fiji-latest-win64-jdk.zip')
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile fiji.zip -UseBasicParsing; Write-Host "OK $u"; break }
            catch { Write-Host "failed $u" }
          }
          Expand-Archive fiji.zip -DestinationPath fiji
          $exe = Get-ChildItem fiji -Recurse -Include ImageJ-win64.exe,fiji-windows-x64.exe,fiji-win64.exe | Select-Object -First 1
          Write-Host "Fiji launcher: $($exe.FullName)"
          "FIJI_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Step 00 → 5 on synthetic videos (.tif, PNG frames, .mpg via ffmpeg)
        run: |
          python -m pip install imageio-ffmpeg
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          python tools/fiji_check.py "$env:FIJI_EXE" "$env:RUNNER_TEMP\fijicheck" "$ff"
      - name: Fiji log
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\fijicheck" -Recurse -Filter "_fiji_журнал*.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName }

  macos:
    # Mac на Apple Silicon (как у друга): самопроверка, окно открывается, шаги 00 → 5 с настоящей Fiji
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt imageio-ffmpeg
      - name: Self-test
        run: python SpermPipeline.py --selftest
      - name: Window module imports (tkinter)
        run: python -c "import tkinter, sperm_pipeline.app; print('tk', tkinter.TkVersion)"
      - name: Download Fiji (macOS arm64)
        run: |
          for u in \
            https://downloads.imagej.net/fiji/stable/fiji-stable-macos-arm64-jdk.zip \
            https://downloads.imagej.net/fiji/latest/fiji-latest-macos-arm64-jdk.zip \
            https://downloads.imagej.net/fiji/stable/fiji-stable-macos64-jdk.zip \
            https://downloads.imagej.net/fiji/archive/20240614-2117/fiji-macosx.zip; do
            if curl -fsSL -o fiji.zip "$u"; then echo "OK $u"; break; else echo "failed $u"; fi
          done
          unzip -q fiji.zip -d fiji
          app=$(find fiji -maxdepth 3 -name 'Fiji*.app' -type d | head -1)
          [ -z "$app" ] && app=$(find fiji -maxdepth 2 -type d -iname 'fiji*' | head -1)
          echo "Fiji folder: $app"; ls "$app" "$app/Contents/MacOS" 2>/dev/null || true
          xattr -dr com.apple.quarantine "$app" 2>/dev/null || true
          echo "FIJI_APP=$PWD/$app" >> $GITHUB_ENV
      - name: Step 00 → 5 on synthetic videos with real Fiji
        run: |
          python -c "from sperm_pipeline.trackmate import resolve_fiji; import os; print('launcher:', resolve_fiji(os.environ['FIJI_APP']))"
          ff=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          python tools/fiji_check.py "$FIJI_APP" "$RUNNER_TEMP/fijicheck" "$ff"
      - name: Fiji log
        if: always()
        run: find "$RUNNER_TEMP/fijicheck" -name '_fiji_журнал*.txt' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; 2>/dev/null || true
